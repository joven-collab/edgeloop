name: Handy Newer Mode
description: Top-bar toggle between Stash's own Handy support (Classic) and the Handy's newer streaming mode (firmware 4, API v3) for faster starts, seeks and scene changes.
version: 1.0
ui:
  javascript:
    - handyNewer.js
  css:
    - handyNewer.css
  csp:
    connect-src:
      - "https://www.handyfeeling.com"
settings:
  connectionKey:
    displayName: Handy connection key
    description: Leave empty to use the key from Stash's Interface settings.
    type: STRING
  appId:
    displayName: Handy Application ID
    description: From user.handyfeeling.com (Application IDs, system Handy REST API).
    type: STRING
